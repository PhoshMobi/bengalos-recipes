[Build]
ToolsTree=yes
ToolsTreeDistribution=debian
ToolsTreeRelease=forky
ToolsTreePackages=
        systemd-tpm

[Distribution]
Distribution=debian
Release=forky
Repositories=
        contrib
        non-free-firmware

[Output]
ImageId=BengalOS
Format=disk
SplitArtifacts=uki,partitions,os-release,kernel-modules-initrd
ManifestFormat=json

[Content]
UnifiedKernelImageFormat=%i_%v_%a
Bootable=true
WithRecommends=true
WithDocs=false
Packages=
        bengalos-base
        mount
        systemd-boot-efi
        systemd-tpm

RootPassword=root
Splash=/usr/share/systemd/bootctl/bengalos-splash.bmp
InitrdProfiles=plymouth
InitrdPackages=
        bengalos-initramfs
        mount
        systemd-tpm

KernelCommandLine=
        quiet
        splash
        plymouth.ignore-serial-consoles
        systemd.firstboot=off

ExtraTrees=../splash:/usr/share/systemd/bootctl/
